# Existing router NAT: public 15060 -> LAN 8080; public 15061 -> LAN 8081.
# Nginx owns the LAN ports; Docker backends bind to loopback only.
server {
    listen 8080;
    listen [::]:8080;
    server_name ziii.ddns.net 192.168.100.141;
    server_tokens off;
    include /etc/nginx/snippets/projects.locations.conf;
    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect default;
        proxy_read_timeout 120s;
    }
}

server {
    listen 8081;
    listen [::]:8081;
    server_name ziii.ddns.net 192.168.100.141;
    server_tokens off;
    include /etc/nginx/snippets/projects.locations.conf;
    location / {
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect default;
        proxy_read_timeout 120s;
    }
}
