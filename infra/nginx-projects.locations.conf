client_max_body_size 10m;

location = /proyectos/hardsystem {
    return 308 /proyectos/hardsystem/$is_args$args;
}
location ^~ /proyectos/hardsystem/ {
    proxy_pass http://127.0.0.1:8080/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /proyectos/hardsystem;
    proxy_redirect default;
    proxy_redirect / /proyectos/hardsystem/;
    proxy_cookie_path / /proyectos/hardsystem/;
    proxy_read_timeout 120s;
}

location = /proyectos/systemach {
    return 308 /proyectos/systemach/$is_args$args;
}
location ^~ /proyectos/systemach/ {
    proxy_pass http://127.0.0.1:8081/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /proyectos/systemach;
    proxy_redirect default;
    proxy_redirect / /proyectos/systemach/;
    proxy_cookie_path / /proyectos/systemach/;
    proxy_read_timeout 120s;
}

location / {
    return 404;
}
