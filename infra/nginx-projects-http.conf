# Bootstrap: local routing tests and public ACME validation before HTTPS.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name ziii.ddns.net 192.168.100.141;
    server_tokens off;

    allow 127.0.0.1;
    allow ::1;
    allow 192.168.100.0/24;
    deny all;

    location ^~ /.well-known/acme-challenge/ {
        allow all;
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    include /etc/nginx/snippets/projects.locations.conf;
    location / { return 404; }
}
